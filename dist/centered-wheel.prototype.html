  <style>
:root{color-scheme:light;--page:#fff8f1;--ink:#2b2125;--muted:#74636b;--rose:#9d3e61;--line:#d8bdc7;--panel:#fffdfb;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--page);color:var(--ink);font:1rem/1.5 var(--sans)}
button,input{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer;transition:background-color 150ms ease-out,color 150ms ease-out}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #702947;outline-offset:4px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.header{min-height:64px;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);min-height:44px}
.brand img{height:auto;width:48px}.brand span{font:2.5rem/1 Georgia,serif;letter-spacing:-.08em}
.primary-button{min-height:56px;padding:12px 40px;border:1px solid var(--rose);border-radius:10px;background:var(--rose);color:white;font-weight:600}
.primary-button:hover:not(:disabled){background:#822f4f}
.secondary-button{min-height:44px;padding:10px 16px;border:1px solid #9c7a88;border-radius:7px;background:transparent;color:var(--ink)}
.secondary-button:hover:not(:disabled){background:#fbe9ef}
.text-button{min-height:44px;padding:8px 0;border:0;background:transparent;color:var(--rose);text-align:left}
.icon-button{width:44px;height:44px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:1.6rem}
.icon-button:hover{background:#fbe9ef}
.layout{min-height:calc(100dvh - 64px);padding-bottom:72px}
.game{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;min-width:0;padding:16px;position:relative}
.wheel-stage{position:relative;width:min(100%,calc(100dvh - 252px),48rem);padding-top:12px;flex-shrink:0}
.wheel-frame{position:relative;padding:10px;border:1px solid #c99aa8;border-radius:50%;background:#f8e6dc}
#wheel{display:block;width:100%;height:auto;border-radius:50%;will-change:transform}
.pointer{position:absolute;top:0;left:50%;z-index:2;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:38px solid var(--rose)}
.wheel-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border:6px solid #fff3e9;border-radius:50%;background:var(--page);display:grid;place-items:center;z-index:1}
.hub-brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}.hub-brand img{width:58%;height:auto}.hub-brand span{font:clamp(1.25rem,3vw,2.5rem)/1.2 Georgia,serif;letter-spacing:-.07em}
.game-actions{display:flex;justify-content:center;min-height:56px}
.game-actions .primary-button{min-width:240px}
.settings-panel{background:var(--panel);padding:24px;min-width:0;align-self:stretch}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.panel-heading h2{font-size:1.125rem;font-weight:600;margin:0}
.sample-note{font-size:.8125rem;line-height:1.6;color:var(--muted);margin:0 0 20px;max-width:240px}
.prize-fields{display:flex;flex-direction:column;gap:12px}
.prize-row{display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:8px}
.prize-row label{display:flex;flex-direction:column;gap:4px;min-width:0}
.prize-row label span{font-size:.875rem;color:var(--muted)}
.prize-row input{width:100%;min-width:0;min-height:44px;padding:8px;border:1px solid #9c7a88;border-radius:6px;color:var(--ink);background:white;font-size:1rem}
.prize-row input[type=number]{text-align:center;padding-inline:4px}
.apply-button{margin-top:20px;width:100%}
.session-summary{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:24px;padding-top:16px;font-size:.875rem;color:var(--muted)}
.session-summary strong{font-size:1rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.history{margin:12px 0 0;padding:0;list-style:none;max-height:116px;overflow:auto;color:var(--muted);font-size:.8125rem}
.history li{padding-block:4px;display:flex;justify-content:space-between;gap:8px}.history li span{color:var(--ink)}
.settings-message{font-size:.8125rem;color:var(--rose);margin:0;min-height:1.5em}
.variant-a{display:grid;grid-template-columns:minmax(0,1fr) 320px}
.variant-a .game{min-height:calc(100dvh - 136px)}
.variant-a .settings-panel{border-left:1px solid var(--line)}
.variant-a #close-settings{display:none}
body[data-variant=A] #settings-toggle{visibility:hidden}
.variant-b{position:relative;display:flex;justify-content:center}
.variant-b .game{width:100%;min-height:calc(100dvh - 136px);padding:16px}
.variant-b .wheel-stage{width:min(100%,calc(100dvh - 252px),56rem)}
.variant-b .settings-panel{position:fixed;right:20px;top:92px;bottom:92px;width:320px;border:1px solid var(--line);border-radius:12px;z-index:4;overflow:auto;box-shadow:0 2px 12px rgb(43 33 37 / .08)}
.variant-c{display:grid;grid-template-columns:280px minmax(0,1fr)}
.variant-c .settings-panel{border-right:1px solid var(--line);padding-inline:20px}
.variant-c .game{min-height:calc(100dvh - 136px);padding:16px}
.variant-c .wheel-stage{width:min(100%,calc(100dvh - 184px),52rem)}
.variant-c .game-actions{display:none}
.variant-c .wheel-hub{padding:0;border-width:5px}
.variant-c .wheel-hub .primary-button{width:100%;height:100%;border-radius:50%;padding:8px;min-height:0;font-size:clamp(.9375rem,1.5vw,1.125rem)}
.variant-c #close-settings{display:none}
body[data-variant=C] #settings-toggle{visibility:hidden}
dialog{position:fixed;max-width:calc(100% - 32px);max-height:calc(100dvh - 32px);width:420px;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:40px 28px 28px;background:var(--panel);color:var(--ink);text-align:center}
dialog::backdrop{background:rgb(43 33 37 / .4)}
dialog h2{font:400 2.5rem/1.2 Georgia,serif;color:var(--rose);margin:16px 0;overflow-wrap:anywhere}
dialog p{margin:0;color:var(--muted);font-size:.875rem}
dialog .primary-button{margin-top:24px;width:100%}
.dialog-close{position:absolute;right:8px;top:8px}
.state-dialog{width:640px;text-align:left}.state-dialog h2{font:600 1.125rem/1.5 var(--sans);color:var(--ink)}
.state-dialog pre{font:.8125rem/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.prototype-switcher{position:fixed;z-index:10;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 24px);min-height:56px;padding:6px;display:flex;align-items:center;gap:4px;background:var(--ink);color:white;border:1px solid #5f5158;border-radius:12px;box-shadow:0 1px 2px rgb(0 0 0 / .1);font-size:.875rem}
.prototype-switcher button{flex-shrink:0;width:44px;height:44px;border:0;border-radius:7px;background:transparent;color:white;font-size:1.125rem}
.prototype-switcher button:hover{background:#514048}.prototype-switcher button:focus-visible{outline-color:white}
.prototype-label{padding-inline:12px;font-size:.75rem;color:#e6ccd5}
.variant-label{min-width:140px;text-align:center;font-weight:500}
.prototype-switcher .state-button{font-size:.8125rem;width:52px;border-left:1px solid #817079;border-radius:0}
@media(min-width:1600px){.variant-a{grid-template-columns:minmax(0,1fr) 360px}.variant-c{grid-template-columns:320px minmax(0,1fr)}}
@media(max-width:1100px) and (min-width:901px){.variant-a{grid-template-columns:minmax(0,1fr) 280px}.settings-panel{padding:20px}.variant-c{grid-template-columns:248px minmax(0,1fr)}.prize-row{grid-template-columns:minmax(0,1fr) 60px}}
@media(max-width:900px){.header{min-height:68px;padding:12px 20px}.brand img{width:40px}.brand span{font-size:2.125rem}.layout.variant-a,.layout.variant-b,.layout.variant-c{display:block;min-height:calc(100dvh - 68px);padding-bottom:88px}.layout .game{min-height:calc(100dvh - 156px);padding:24px 16px;gap:24px}.layout .wheel-stage{width:min(100%,calc(100dvh - 300px),40rem)}.variant-c .wheel-stage{width:min(100%,calc(100dvh - 224px),44rem)}.layout .settings-panel{position:fixed;left:auto;right:12px;top:80px;bottom:88px;width:min(320px,calc(100% - 24px));padding:24px;border:1px solid var(--line);border-radius:12px;z-index:4;overflow:auto}.layout #close-settings{display:block}body[data-variant] #settings-toggle{visibility:visible}.prototype-label{display:none}.variant-label{min-width:140px}.wheel-hub{border-width:4px}.game-actions .primary-button{min-width:min(240px,100%)}}
@media(max-width:380px){.variant-label{min-width:128px;font-size:.8125rem}.header{padding-inline:16px}.prototype-switcher{bottom:12px}.prototype-switcher .state-button{width:44px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

</style>

  <dialog id="state-dialog" class="state-dialog" aria-labelledby="state-heading">
    <button class="dialog-close icon-button" data-close="state-dialog" type="button" aria-label="Tutup data prototype">×</button>
    <h2 id="state-heading">State prototype</h2><pre id="state-json"></pre>
  </dialog>
  <nav id="prototype-switcher" class="prototype-switcher" aria-label="Pilihan layout prototype" hidden>
    <span class="prototype-label">Prototype</span>
    <button id="previous-variant" type="button" aria-label="Varian sebelumnya">←</button>
    <span id="variant-label" class="variant-label" role="status"></span>
    <button id="next-variant" type="button" aria-label="Varian berikutnya">→</button>
    <button id="show-state" class="state-button" type="button">Data</button>
  </nav>
<script type="module">
function randomInteger(limit, cryptoProvider = globalThis.crypto) {
  if (!Number.isSafeInteger(limit) || limit < 1 || limit > 2 ** 32) {
    throw new RangeError('Jumlah pilihan tidak valid.');
  }
  const values = new Uint32Array(1);
  const ceiling = Math.floor(2 ** 32 / limit) * limit;
  do {
    cryptoProvider.getRandomValues(values);
  } while (values[0] >= ceiling);
  return values[0] % limit;
}

function createSession(prizes) {
  if (!Array.isArray(prizes) || prizes.length < 2 || prizes.length > 10) {
    throw new Error('Isi 2 sampai 10 jenis hadiah.');
  }
  const ids = new Set();
  for (const prize of prizes) {
    if (typeof prize.id !== 'string' || !prize.id || ids.has(prize.id)) {
      throw new Error('Setiap hadiah harus memiliki ID yang berbeda.');
    }
    if (typeof prize.label !== 'string' || !prize.label.trim() || prize.label.trim().length > 28) {
      throw new Error('Nama hadiah harus berisi 1 sampai 28 karakter.');
    }
    if (!Number.isSafeInteger(prize.quantity) || prize.quantity < 0 || prize.quantity > 9999) {
      throw new Error('Stok hadiah harus berupa angka bulat antara 0 dan 9999.');
    }
    ids.add(prize.id);
  }
  return {
    version: 1,
    prizes: prizes.map(prize => ({ id: prize.id, label: prize.label.trim(), quantity: prize.quantity })),
    history: [],
    pending: null,
  };
}

function reserveSpin(session, pick = randomInteger, timestamp = new Date().toISOString()) {
  if (session.pending) throw new Error('Selesaikan giliran sebelumnya dulu.');
  const available = session.prizes.filter(prize => prize.quantity > 0);
  if (!available.length) throw new Error('Semua hadiah sudah habis.');
  const index = pick(available.length);
  if (!Number.isInteger(index) || index < 0 || index >= available.length) {
    throw new Error('Hasil undian tidak valid. Coba lagi.');
  }
  const winner = available[index];
  const result = { number: session.history.length + 1, prizeId: winner.id, label: winner.label, timestamp };
  return {
    ...session,
    prizes: session.prizes.map(prize => prize.id === winner.id ? { ...prize, quantity: prize.quantity - 1 } : { ...prize }),
    history: [...session.history, result],
    pending: result,
  };
}

function nextVisitor(session) {
  return { ...session, pending: null };
}

function targetRotation(index, count, previous = 0, turns = 6) {
  if (!Number.isInteger(index) || !Number.isInteger(count) || count < 1 || index < 0 || index >= count) {
    throw new RangeError('Posisi roda tidak valid.');
  }
  const center = (index + 0.5) * (360 / count);
  const target = (360 - center) % 360;
  const current = ((previous % 360) + 360) % 360;
  return previous + turns * 360 + ((target - current + 360) % 360);
}

function restoreSession(text) {
  const session = JSON.parse(text);
  if (!session || session.version !== 1) throw new Error('Format data undian tidak dikenali.');
  createSession(session.prizes);
  if (!Array.isArray(session.history)) throw new Error('Riwayat undian tidak valid.');
  for (const [index, result] of session.history.entries()) {
    if (result.number !== index + 1 || typeof result.label !== 'string' || typeof result.timestamp !== 'string' || !session.prizes.some(prize => prize.id === result.prizeId)) {
      throw new Error('Riwayat undian tidak valid.');
    }
  }
  if (session.pending !== null && (!session.history.length || JSON.stringify(session.pending) !== JSON.stringify(session.history.at(-1)))) {
    throw new Error('Giliran terakhir tidak valid.');
  }
  return session;
}


// Throwaway prototype: three centered-wheel layouts on this route via ?variant=A|B|C.
const prizes = [
  { id: 'sticker', label: 'Sticker pack', quantity: 20 },
  { id: 'keychain', label: 'Gantungan kunci', quantity: 10 },
  { id: 'pin', label: 'Pin SARAS', quantity: 15 },
  { id: 'notebook', label: 'Notebook', quantity: 10 },
  { id: 'pouch', label: 'Pouch', quantity: 8 },
  { id: 'totebag', label: 'Tote bag', quantity: 5 },
];
const colors = ['#f2d6e0','#fff0dd','#d987a8','#fbe9ef','#f0c8ae','#e6b4c7'];
const names = { A: 'Panel kanan', B: 'Laci samping', C: 'Editor kiri' };
const $ = selector => document.querySelector(selector);
const layout = $('#layout'), game = $('#game'), panel = $('#settings-panel');
const wheel = $('#wheel'), spinButton = $('#spin-button'), hub = $('#wheel-hub');
const hubBrand = $('#hub-brand'), actions = $('#game-actions');
const mobile = matchMedia('(max-width:900px)');
let session = createSession(prizes);
let rotation = 0, spinning = false, settingsOpen = false;
let variant = new URL(location.href).searchParams.get('variant')?.toUpperCase() || 'A';
if (!names[variant]) variant = 'A';
const prototypeMode = ['localhost','127.0.0.1',''].includes(location.hostname) && (new URL(location.href).searchParams.has('prototype') || location.pathname.endsWith('.prototype.html'));
$('#prototype-switcher').hidden = !prototypeMode;

export function VariantA() {
  layout.className = 'layout variant-a';
  layout.replaceChildren(game, panel);
  hubBrand.hidden = false; hub.replaceChildren(hubBrand);
  actions.append(spinButton);
}
export function VariantB() {
  layout.className = 'layout variant-b';
  layout.replaceChildren(game);
  layout.append(panel);
  hubBrand.hidden = false; hub.replaceChildren(hubBrand);
  actions.append(spinButton);
}
export function VariantC() {
  layout.className = 'layout variant-c';
  layout.replaceChildren(panel, game);
  hubBrand.hidden = true; hub.replaceChildren(spinButton);
}

function updatePanel() {
  const drawer = variant === 'B' || mobile.matches;
  panel.hidden = drawer && !settingsOpen;
  $('#settings-toggle').setAttribute('aria-expanded', String(!panel.hidden));
}

function showState() {
  const state = { variant, layout: names[variant], spinning, rotation, settingsOpen, session };
  $('#state-json').textContent = JSON.stringify(state, null, 2);
  if (prototypeMode) console.info('SARAS layout prototype', state);
}

function switchVariant(key) {
  variant = key; settingsOpen = false;
  document.body.dataset.variant = variant;
  ({ A: VariantA, B: VariantB, C: VariantC })[variant]();
  const url = new URL(location.href);
  url.searchParams.set('variant', variant);
  history.replaceState(null, '', url);
  $('#variant-label').textContent = variant + ' · ' + names[variant];
  updatePanel(); renderControls(); showState();
}

function cycleVariant(direction) {
  const keys = Object.keys(names);
  switchVariant(keys[(keys.indexOf(variant) + direction + keys.length) % keys.length]);
}

function svgNode(tag, attrs, text) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
  if (text !== undefined) node.textContent = text;
  return node;
}

function drawWheel() {
  wheel.replaceChildren();
  const size = Math.max(20, 14 * 560 / Math.max(wheel.clientWidth, 200));
  const angle = 360 / session.prizes.length;
  session.prizes.forEach((prize, i) => {
    const start = (i * angle - 90) * Math.PI / 180, end = ((i + 1) * angle - 90) * Math.PI / 180;
    const x1 = 280 + 266 * Math.cos(start), y1 = 280 + 266 * Math.sin(start);
    const x2 = 280 + 266 * Math.cos(end), y2 = 280 + 266 * Math.sin(end);
    wheel.append(svgNode('path', { d: 'M280 280L' + x1 + ' ' + y1 + 'A266 266 0 0 1 ' + x2 + ' ' + y2 + 'Z', fill: prize.quantity ? colors[i % colors.length] : '#e8dfdd', stroke:'#fff8f1','stroke-width':2 }));
    const degrees = (i + .5) * angle - 90, radians = degrees * Math.PI / 180;
    const orientation = degrees > 90 && degrees < 270 ? degrees + 180 : degrees;
    const text = svgNode('text', { transform:'translate(' + (280 + 169 * Math.cos(radians)) + ' ' + (280 + 169 * Math.sin(radians)) + ') rotate(' + orientation + ')', 'text-anchor':'middle','dominant-baseline':'middle',fill:'#2b2125','font-family':'-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif','font-weight':550,'font-size':size });
    const words = prize.label.split(' ');
    const lines = prize.label.length > 12 && words.length > 1 ? [words.slice(0, -1).join(' '), words.at(-1)] : [prize.label];
    if (!prize.quantity) lines.push('Habis');
    lines.forEach((line, row) => text.append(svgNode('tspan', { x:0,y:(row - (lines.length - 1) / 2) * size * 1.2 }, line)));
    wheel.append(text);
  });
  wheel.append(svgNode('circle', { cx:280,cy:280,r:270,fill:'none',stroke:'#fff8f1','stroke-width':10 }));
  wheel.setAttribute('aria-label', 'Roda hadiah: ' + session.prizes.map(p => p.label + (p.quantity ? '' : ' habis')).join(', '));
}

function renderControls() {
  const available = session.prizes.some(p => p.quantity > 0);
  spinButton.disabled = spinning || (!available && !session.pending);
  spinButton.textContent = spinning ? 'Berputar…' : session.pending ? 'Lihat hadiah' : available ? 'Putar roda' : 'Hadiah habis';
  $('#spin-status').textContent = spinning ? 'Roda sedang berputar.' : session.pending ? 'Hadiah terpilih: ' + session.pending.label : available ? 'Roda siap diputar.' : 'Semua hadiah habis.';
  $('#apply-button').disabled = $('#reset-button').disabled = spinning || Boolean(session.pending);
  $('#draw-count').textContent = session.history.length;
}

function renderSettings() {
  const fields = $('#prize-fields');
  fields.replaceChildren();
  session.prizes.forEach((prize, i) => {
    const row = document.createElement('div'); row.className = 'prize-row';
    for (const kind of ['name','stock']) {
      const label = document.createElement('label'), caption = document.createElement('span'), input = document.createElement('input');
      caption.textContent = kind === 'name' ? 'Hadiah ' + (i + 1) : 'Sisa stok';
      input.name = kind + '-' + i;
      input.type = kind === 'name' ? 'text' : 'number';
      input.value = kind === 'name' ? prize.label : prize.quantity;
      input.required = true;
      if (kind === 'name') input.maxLength = 28;
      else { input.min = 0; input.max = 9999; input.step = 1; input.inputMode = 'numeric'; }
      input.disabled = spinning || Boolean(session.pending);
      label.append(caption, input); row.append(label);
    }
    fields.append(row);
  });
  const historyList = $('#history'); historyList.replaceChildren();
  if (!session.history.length) {
    const empty = document.createElement('li'); empty.textContent = 'Belum ada putaran.'; historyList.append(empty);
  }
  session.history.slice().reverse().forEach(result => {
    const row = document.createElement('li'), label = document.createElement('span');
    row.textContent = String(result.number).padStart(3, '0'); label.textContent = result.label;
    row.append(label); historyList.append(row);
  });
  renderControls(); showState();
}

function presentResult() {
  $('#result-prize').textContent = session.pending.label;
  $('#result-turn').textContent = 'Giliran ' + String(session.pending.number).padStart(3, '0');
  if (!$('#result-dialog').open) $('#result-dialog').showModal();
}

spinButton.addEventListener('click', async () => {
  if (spinning) return;
  if (session.pending) { presentResult(); return; }
  session = reserveSpin(session);
  spinning = true; renderControls(); renderSettings();
  const index = session.prizes.findIndex(p => p.id === session.pending.prizeId);
  const target = targetRotation(index, session.prizes.length, rotation);
  const animation = wheel.animate([{ transform:'rotate(' + rotation + 'deg)' }, { transform:'rotate(' + target + 'deg)' }], { duration:matchMedia('(prefers-reduced-motion:reduce)').matches ? 120 : 4200,easing:'cubic-bezier(.12,.69,.13,1)',fill:'forwards' });
  await animation.finished;
  rotation = target; wheel.style.transform = 'rotate(' + rotation + 'deg)'; animation.cancel();
  spinning = false; renderControls(); renderSettings(); presentResult();
});

$('#next-button').addEventListener('click', () => {
  session = nextVisitor(session); $('#result-dialog').close();
  drawWheel(); renderSettings(); spinButton.focus();
});
$('#prize-form').addEventListener('submit', event => {
  event.preventDefault();
  const values = new FormData(event.currentTarget);
  const updated = createSession(session.prizes.map((prize, i) => ({ id:prize.id,label:String(values.get('name-' + i)).trim() || prize.label,quantity:Number(values.get('stock-' + i)) })));
  session = { ...updated,history:session.history };
  $('#settings-message').textContent = 'Hadiah diperbarui untuk sesi ini.';
  drawWheel(); renderSettings();
});
$('#reset-button').addEventListener('click', () => {
  session = createSession(prizes); rotation = 0; wheel.style.transform = 'rotate(0deg)';
  $('#settings-message').textContent = 'Contoh direset.';
  drawWheel(); renderSettings();
});
$('#settings-toggle').addEventListener('click', () => { settingsOpen = !settingsOpen; updatePanel(); showState(); });
$('#close-settings').addEventListener('click', () => { settingsOpen = false; updatePanel(); showState(); $('#settings-toggle').focus(); });
$('#previous-variant').addEventListener('click', () => cycleVariant(-1));
$('#next-variant').addEventListener('click', () => cycleVariant(1));
$('#show-state').addEventListener('click', () => { showState(); $('#state-dialog').showModal(); });
document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => document.getElementById(button.dataset.close).close()));
document.addEventListener('keydown', event => {
  if (!prototypeMode || event.target.closest('input,textarea,select,[contenteditable]') || document.querySelector('dialog[open]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); cycleVariant(event.key === 'ArrowLeft' ? -1 : 1); }
});
document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('keydown', event => {
  if (event.key !== 'Tab') return;
  const controls = [...dialog.querySelectorAll('button:not(:disabled)')];
  if (event.shiftKey && document.activeElement === controls[0]) { event.preventDefault(); controls.at(-1).focus(); }
  else if (!event.shiftKey && document.activeElement === controls.at(-1)) { event.preventDefault(); controls[0].focus(); }
}));
mobile.addEventListener('change', updatePanel);
let width = 0;
new ResizeObserver(() => { if (width !== wheel.clientWidth) { width = wheel.clientWidth; drawWheel(); } }).observe(wheel);
switchVariant(variant); renderSettings(); drawWheel();

</script>
  </body>
</html>
