  <style>
:root {
  color-scheme: light;
  --pink: #E983A7;
  --rose: #9D3E61;
  --cream: #FFF8F1;
  --ink: #2B2125;
  --muted: color-mix(in srgb, var(--rose) 92%, var(--cream));
  --line: color-mix(in srgb, var(--rose) 24%, var(--cream));
  --control-line: color-mix(in srgb, var(--rose) 74%, var(--cream));
  --wash: color-mix(in srgb, var(--rose) 5%, var(--cream));
  --shadow: color-mix(in srgb, var(--rose) 16%, transparent);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--cream); color: var(--rose); font: 1rem/1.5 var(--sans); }
button, input { font: inherit; }
button, a[href], summary, select, label[for], [role="button"] { cursor: pointer; touch-action: manipulation; }
button { transition: background-color 150ms ease-out, transform 150ms ease-out, box-shadow 150ms ease-out; }
button:active:not(:disabled) { transform: translateY(2px); }
button:disabled, input:disabled { cursor: not-allowed; }
button:disabled { border-style: dashed; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--rose); outline-offset: 5px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.header { min-height: 72px; padding: 12px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-height: 44px; color: var(--rose); text-decoration: none; }
.brand img { width: 42px; height: auto; }
.brand span { font: 2.375rem/1 var(--serif); letter-spacing: -.075em; }
.brand:hover span { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.brand:active { transform: translateY(1px); }
.primary-button { min-height: 54px; padding: 14px 36px; border: 1px solid var(--rose); border-radius: 4px; background: var(--rose); color: var(--cream); font-size: 1rem; font-weight: 600; box-shadow: 0 3px 0 color-mix(in srgb, var(--rose) 45%, transparent); }
.primary-button:hover:not(:disabled) { box-shadow: 0 4px 0 color-mix(in srgb, var(--rose) 55%, transparent); transform: translateY(-1px); }
.primary-button:active:not(:disabled) { box-shadow: 0 1px 0 var(--shadow); transform: translateY(2px); }
.primary-button:disabled { box-shadow: none; }
.secondary-button { min-height: 44px; padding: 10px 16px; border: 1px solid var(--control-line); border-radius: 3px; background: transparent; color: var(--rose); font-size: .875rem; font-weight: 500; }
.secondary-button:hover:not(:disabled) { background: var(--wash); text-decoration: underline; text-underline-offset: 4px; }
.secondary-button:disabled { color: var(--muted); }
.text-button { min-height: 44px; padding: 8px 0; border: 0; background: transparent; color: var(--rose); text-align: left; font-size: .875rem; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
.text-button:hover:not(:disabled) { text-decoration-thickness: 2px; }
.text-button:disabled { text-decoration-style: dotted; }
.icon-button { width: 44px; height: 44px; border: 0; border-radius: 3px; background: transparent; color: var(--rose); font-size: 1.5rem; }
.icon-button:hover { background: var(--wash); box-shadow: inset 0 0 0 1px var(--control-line); }
.layout { min-height: calc(100dvh - 72px); padding-bottom: 80px; }
.game { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; min-width: 0; padding: 24px; position: relative; }
.wheel-stage { position: relative; flex-shrink: 0; width: min(100%, calc(100dvh - 304px), 47rem); padding-top: 20px; }
.wheel-frame { position: relative; overflow: clip; padding: 12px; border: 2px solid var(--rose); border-radius: 50%; background: var(--pink); outline: 1px solid var(--line); outline-offset: 6px; box-shadow: 0 10px 20px -16px color-mix(in srgb, var(--rose) 65%, transparent); }
.wheel-frame::before { content: ""; position: absolute; inset: 5px; border: 1px solid color-mix(in srgb, var(--cream) 60%, var(--rose)); border-radius: 50%; pointer-events: none; }
#wheel { display: block; width: 100%; height: auto; border-radius: 50%; will-change: transform; }
.pointer { position: absolute; width: 48px; height: 75px; top: -8px; left: 50%; transform: translateX(-50%); z-index: 3; pointer-events: none; }
.pointer svg { display: block; width: 100%; height: 100%; transform-origin: 50% 29%; }
.pointer-leaf { fill: var(--rose); stroke: var(--cream); stroke-width: 2; }
.pointer-pin { fill: var(--cream); }
.pointer-slot { fill: none; stroke: var(--rose); stroke-width: 1.5; stroke-linecap: round; }
.wheel-hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 20%; aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--cream); box-shadow: 0 0 0 2px var(--rose), 0 0 0 8px var(--cream), 0 0 0 9px var(--control-line), 0 4px 0 9px var(--shadow); display: grid; place-items: center; container-type: inline-size; z-index: 2; }
.wheel-hub::after { content: ""; position: absolute; inset: 8px; border: 1px solid var(--line); border-radius: 50%; pointer-events: none; }
.hub-brand { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.hub-brand img { width: 44%; height: auto; }
.hub-brand span { font: 24cqw/1.1 var(--serif); letter-spacing: -.07em; }
.game-actions { display: flex; justify-content: center; min-height: 54px; }
.game-actions .primary-button { min-width: 224px; }
.settings-panel { background: var(--cream); padding: 20px 28px 24px; min-width: 0; align-self: stretch; }
.panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.panel-heading h2 { font: 400 1.625rem/1.25 var(--serif); letter-spacing: -.035em; margin: 0; }
.sample-note { color: var(--muted); font-size: .8125rem; line-height: 1.65; margin: 0 0 24px; max-width: 240px; }
.prize-fields { display: flex; flex-direction: column; gap: 14px; }
.prize-row { display: grid; grid-template-columns: minmax(0,1fr) 60px; gap: 16px; }
.prize-row label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.prize-row label span { color: var(--muted); font-size: .875rem; }
.prize-row input { width: 100%; min-width: 0; min-height: 44px; border: 0; border-bottom: 1px solid var(--control-line); border-radius: 0; background: transparent; color: var(--rose); padding: 8px 0; font-size: 1rem; }
.prize-row input:hover:not(:disabled) { border-bottom-width: 2px; padding-bottom: 7px; }
.prize-row input:disabled { border-bottom-style: dotted; color: var(--muted); }
.prize-row input[type=number] { text-align: right; appearance: textfield; -moz-appearance: textfield; font-variant-numeric: tabular-nums; }
.prize-row input::-webkit-inner-spin-button, .prize-row input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.apply-button { margin-top: 24px; width: 100%; }
.session-summary { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 24px; padding-top: 20px; font-size: .875rem; color: var(--muted); }
.session-summary strong { font: 400 1.5rem/1 var(--serif); color: var(--rose); font-variant-numeric: tabular-nums; }
.history { list-style: none; padding: 0; margin: 12px 0 0; max-height: 104px; overflow: auto; color: var(--muted); font-size: .8125rem; }
.history li { display: flex; justify-content: space-between; gap: 12px; padding-block: 4px; }
.history li span { color: var(--rose); }
.settings-message { color: var(--rose); font-size: .8125rem; margin: 0; min-height: 1.5em; }
.variant-a { display: grid; grid-template-columns: minmax(0,1fr) 312px; }
.variant-a .game { min-height: calc(100dvh - 152px); }
.variant-a .settings-panel { border-left: 1px solid var(--line); }
.variant-a #close-settings, .variant-c #close-settings { display: none; }
body[data-variant=A] #settings-toggle, body[data-variant=C] #settings-toggle { visibility: hidden; }
.variant-b { position: relative; display: flex; justify-content: center; }
.variant-b .game { width: 100%; min-height: calc(100dvh - 152px); }
.variant-b .wheel-stage { width: min(100%, calc(100dvh - 304px), 54rem); }
.variant-b .settings-panel { position: fixed; top: 84px; right: 24px; bottom: 96px; width: 312px; border: 1px solid var(--control-line); z-index: 5; overflow: auto; box-shadow: 0 8px 24px -16px var(--shadow); }
.variant-c { display: grid; grid-template-columns: 280px minmax(0,1fr); }
.variant-c .settings-panel { border-right: 1px solid var(--line); padding-inline: 24px; }
.variant-c .game { min-height: calc(100dvh - 152px); }
.variant-c .wheel-stage { width: min(100%, calc(100dvh - 220px), 51rem); }
.variant-c .game-actions { display: none; }
.variant-c .wheel-hub { width: max(20%,3.5rem); }
.variant-c .wheel-hub::after { inset: 5px; border-color: color-mix(in srgb, var(--cream) 50%, var(--rose)); }
.variant-c .wheel-hub .primary-button { width: 100%; height: 100%; min-height: 0; padding: 8px; border-radius: 50%; box-shadow: none; font-size: clamp(.875rem,1.4vw,1.0625rem); line-height: 1.1; }
.variant-c .wheel-hub .primary-button:hover:not(:disabled) { transform: none; box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--cream) 35%, var(--rose)); }
.variant-c .wheel-hub .primary-button:active:not(:disabled) { transform: scale(.98); }
dialog { position: fixed; width: 420px; max-width: calc(100% - 32px); max-height: calc(100dvh - 32px); overflow: auto; padding: 44px 32px 32px; border: 1px solid var(--rose); border-radius: 4px; background: var(--cream); color: var(--rose); text-align: center; box-shadow: 0 4px 0 var(--line); }
dialog::backdrop { background: color-mix(in srgb, var(--rose) 36%, transparent); }
dialog p { margin: 0; color: var(--muted); font-size: .875rem; }
dialog h2 { margin: 12px 0 20px; font: italic 400 clamp(2rem,6vw,2.75rem)/1.15 var(--serif); letter-spacing: -.04em; overflow-wrap: anywhere; }
dialog .primary-button { margin-top: 28px; width: 100%; }
.dialog-close { position: absolute; top: 8px; right: 8px; }
.result-turn { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px; font-variant-numeric: tabular-nums; }
#confetti { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 1; }
#result-dialog > :not(canvas):not(.dialog-close) { position: relative; z-index: 2; }
#result-dialog > .dialog-close { z-index: 2; }
.state-dialog { width: 640px; text-align: left; }
.state-dialog h2 { font: 600 1.125rem/1.5 var(--sans); letter-spacing: 0; }
.state-dialog pre { font: .8125rem/1.6 ui-monospace,monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.prototype-switcher { position: fixed; z-index: 10; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; max-width: calc(100% - 24px); min-height: 56px; padding: 6px; border: 1px solid var(--rose); border-radius: 6px; background: var(--rose); color: var(--cream); font-size: .875rem; }
.prototype-switcher button { width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 2px; background: transparent; color: var(--cream); font-size: 1.125rem; }
.prototype-switcher button:hover { box-shadow: inset 0 0 0 1px var(--cream); }
.prototype-switcher button:focus-visible { outline-color: var(--cream); }
.prototype-label { padding-inline: 12px; font-size: .75rem; }
.variant-label { min-width: 140px; text-align: center; font-weight: 500; }
.prototype-switcher .state-button { width: 52px; border-left: 1px solid var(--cream); font-size: .8125rem; }
@media(min-width:901px) {
  .variant-a .settings-panel,.variant-c .settings-panel { min-height: 0; max-height: calc(100dvh - 152px); overflow: auto; }
}
@media(min-width:1600px) {
  .variant-a { grid-template-columns: minmax(0,1fr) 340px; }
  .variant-c { grid-template-columns: 312px minmax(0,1fr); }
}
@media(max-width:1100px) and (min-width:901px) {
  .variant-a { grid-template-columns: minmax(0,1fr) 280px; }
  .variant-c { grid-template-columns: 260px minmax(0,1fr); }
  .settings-panel { padding-inline: 20px; }
  .prize-row { grid-template-columns: minmax(0,1fr) 54px; gap: 12px; }
}
@media(max-width:900px) {
  .header { min-height: 64px; padding: 8px 20px; }
  .brand img { width: 36px; }
  .brand span { font-size: 2.125rem; }
  .layout.variant-a,.layout.variant-b,.layout.variant-c { display: block; min-height: calc(100dvh - 64px); padding-bottom: 88px; }
  .layout .game { min-height: calc(100dvh - 152px); padding: 24px 20px; gap: 28px; }
  .layout .wheel-stage { width: min(100%,calc(100dvh - 320px),39rem); padding-top: 20px; }
  .variant-c .wheel-stage { width: min(100%,calc(100dvh - 240px),43rem); }
  .wheel-frame { padding: 8px; outline-offset: 4px; }
  .pointer { width: 40px; height: 62.5px; top: -2px; }
  .wheel-hub { box-shadow: 0 0 0 1px var(--rose),0 0 0 5px var(--cream),0 0 0 6px var(--control-line),0 3px 0 6px var(--shadow); }
  .wheel-hub::after { inset: 5px; }
  .layout .settings-panel { position: fixed; top: 76px; right: 12px; bottom: 88px; width: min(312px,calc(100% - 24px)); border: 1px solid var(--control-line); padding: 24px; z-index: 5; overflow: auto; }
  .layout #close-settings { display: block; }
  body[data-variant] #settings-toggle { visibility: visible; }
  .prototype-label { display: none; }
  .game-actions .primary-button { min-width: min(224px,100%); }
}
@media(max-width:380px) {
  .header { padding-inline: 16px; }
  .layout .game { padding-inline: 16px; }
  .variant-label { min-width: 128px; font-size: .8125rem; }
  .prototype-switcher { bottom: 12px; }
  .prototype-switcher .state-button { width: 44px; }
  .layout .settings-panel { padding-inline: 20px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { transition: none !important; animation: none !important; }
}

<script type="module">
function randomInteger(limit, cryptoProvider = globalThis.crypto) {
  if (!Number.isSafeInteger(limit) || limit < 1 || limit > 2 ** 32) {
    throw new RangeError('Jumlah pilihan tidak valid.');
  }
  const values = new Uint32Array(1);
  const ceiling = Math.floor(2 ** 32 / limit) * limit;
  do {
    cryptoProvider.getRandomValues(values);
  } while (values[0] >= ceiling);
  return values[0] % limit;
}

function createSession(prizes) {
  if (!Array.isArray(prizes) || prizes.length < 2 || prizes.length > 10) {
    throw new Error('Isi 2 sampai 10 jenis hadiah.');
  }
  const ids = new Set();
  for (const prize of prizes) {
    if (typeof prize.id !== 'string' || !prize.id || ids.has(prize.id)) {
      throw new Error('Setiap hadiah harus memiliki ID yang berbeda.');
    }
    if (typeof prize.label !== 'string' || !prize.label.trim() || prize.label.trim().length > 28) {
      throw new Error('Nama hadiah harus berisi 1 sampai 28 karakter.');
    }
    if (!Number.isSafeInteger(prize.quantity) || prize.quantity < 0 || prize.quantity > 9999) {
      throw new Error('Stok hadiah harus berupa angka bulat antara 0 dan 9999.');
    }
    ids.add(prize.id);
  }
  return {
    version: 1,
    prizes: prizes.map(prize => ({ id: prize.id, label: prize.label.trim(), quantity: prize.quantity })),
    history: [],
    pending: null,
  };
}

function reserveSpin(session, pick = randomInteger, timestamp = new Date().toISOString()) {
  if (session.pending) throw new Error('Selesaikan giliran sebelumnya dulu.');
  const available = session.prizes.filter(prize => prize.quantity > 0);
  if (!available.length) throw new Error('Semua hadiah sudah habis.');
  const index = pick(available.length);
  if (!Number.isInteger(index) || index < 0 || index >= available.length) {
    throw new Error('Hasil undian tidak valid. Coba lagi.');
  }
  const winner = available[index];
  const result = { number: session.history.length + 1, prizeId: winner.id, label: winner.label, timestamp };
  return {
    ...session,
    prizes: session.prizes.map(prize => prize.id === winner.id ? { ...prize, quantity: prize.quantity - 1 } : { ...prize }),
    history: [...session.history, result],
    pending: result,
  };
}

function nextVisitor(session) {
  return { ...session, pending: null };
}

function targetRotation(index, count, previous = 0, turns = 6) {
  if (!Number.isInteger(index) || !Number.isInteger(count) || count < 1 || index < 0 || index >= count) {
    throw new RangeError('Posisi roda tidak valid.');
  }
  const center = (index + 0.5) * (360 / count);
  const target = (360 - center) % 360;
  const current = ((previous % 360) + 360) % 360;
  return previous + turns * 360 + ((target - current + 360) % 360);
}

function restoreSession(text) {
  const session = JSON.parse(text);
  if (!session || session.version !== 1) throw new Error('Format data undian tidak dikenali.');
  createSession(session.prizes);
  if (!Array.isArray(session.history)) throw new Error('Riwayat undian tidak valid.');
  for (const [index, result] of session.history.entries()) {
    if (result.number !== index + 1 || typeof result.label !== 'string' || typeof result.timestamp !== 'string' || !session.prizes.some(prize => prize.id === result.prizeId)) {
      throw new Error('Riwayat undian tidak valid.');
    }
  }
  if (session.pending !== null && (!session.history.length || JSON.stringify(session.pending) !== JSON.stringify(session.history.at(-1)))) {
    throw new Error('Giliran terakhir tidak valid.');
  }
  return session;
}

function svgNode(tag, attrs, text) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
  if (text !== undefined) node.textContent = text;

function drawWheel() {

    const x1 = 280 + 266 * Math.cos(start), y1 = 280 + 266 * Math.sin(start);

    wheel.append(svgNode('path', { d: 'M280 280L' + x1 + ' ' + y1 + 'A266 266 0 0 1 ' + x2 + ' ' + y2 + 'Z', fill: surface, stroke:'var(--ink)','stroke-width':.75 }));

    const lines = [];

    for (const word of words) {
      if (line && measure.measureText(line + ' ' + word).width > 164) { lines.push(line); line = ''; }

  $('#draw-count').textContent = session.history.length;
  game.dataset.spinning = String(spinning);
  wheel.setAttribute('aria-busy', String(spinning));
}

function renderSettings() {
  const fields = $('#prize-fields');
  fields.replaceChildren();
  session.prizes.forEach((prize, i) => {
    const row = document.createElement('div'); row.className = 'prize-row';
    for (const kind of ['name','stock']) {
      const label = document.createElement('label'), caption = document.createElement('span'), input = document.createElement('input');
      caption.textContent = kind === 'name' ? 'Hadiah ' + (i + 1) : 'Sisa stok';
      input.name = kind + '-' + i;
      input.type = kind === 'name' ? 'text' : 'number';
      input.value = kind === 'name' ? prize.label : prize.quantity;
      input.required = true;
      if (kind === 'name') input.maxLength = 28;
      else { input.min = 0; input.max = 9999; input.step = 1; input.inputMode = 'numeric'; }
      input.disabled = spinning || Boolean(session.pending);
      label.append(caption, input); row.append(label);
    }
    fields.append(row);
  });
  const historyList = $('#history'); historyList.replaceChildren();
  if (!session.history.length) {
    const empty = document.createElement('li'); empty.textContent = 'Belum ada putaran.'; historyList.append(empty);
  }
  session.history.slice().reverse().forEach(result => {
    const row = document.createElement('li'), label = document.createElement('span');
    row.textContent = String(result.number).padStart(3, '0'); label.textContent = result.label;
    row.append(label); historyList.append(row);
  });
  renderControls(); showState();
}

function stopConfetti() {
  cancelAnimationFrame(confettiFrame);
  confetti.hidden = true;
  confetti.width = confetti.height = 1;
}

function celebratePrize() {
  stopConfetti();
  if (motionPreference.matches) return;
  const context = confetti.getContext('2d');
  if (!context) return;
  const width = innerWidth, height = innerHeight;
  const density = Math.min(devicePixelRatio || 1, 2);
  confetti.width = Math.round(width * density);
  confetti.height = Math.round(height * density);
  context.scale(density, density);
  const style = getComputedStyle(document.documentElement);
  const palette = ['--pink','--rose','--cream'].map(color => style.getPropertyValue(color).trim());
  const particles = Array.from({ length:width < 600 ? 80 : 140 }, (_, index) => {
    const side = index % 2;
    return {
      x:width * (side ? .88 : .12), y:height * .72,
      vx:(side ? -1 : 1) * (180 + Math.random() * 380) * Math.min(width / 1000, 1),
      vy:-(480 + Math.random() * 360) * Math.min(height / 800, 1),
      delay:Math.random() * .16, angle:Math.random() * Math.PI,
      turn:(Math.random() - .5) * 16, size:5 + Math.random() * 4,
      color:palette[index % palette.length],
    };
  });
  confetti.hidden = false;
  const start = performance.now();
  function draw(now) {
    const elapsed = (now - start) / 1000;
    context.clearRect(0, 0, width, height);
    if (elapsed >= 3.2) { stopConfetti(); return; }
    for (const particle of particles) {
      const time = elapsed - particle.delay;
      if (time < 0) continue;
      const x = particle.x + particle.vx * time;
      const y = particle.y + particle.vy * time + 500 * time * time;
      if (y > height + 24) continue;
      context.save();
      context.globalAlpha = Math.min(1, (3.2 - elapsed) / .5);
      context.translate(x, y);
      context.rotate(particle.angle + particle.turn * time);
      context.scale(1, Math.cos(particle.angle + time * 10));
      context.fillStyle = particle.color;
      context.fillRect(-particle.size / 2, -particle.size, particle.size, particle.size * 2);
      context.restore();
    }
    confettiFrame = requestAnimationFrame(draw);
  }
  confettiFrame = requestAnimationFrame(draw);
}

function presentResult(celebrate = false) {
  $('#result-prize').textContent = session.pending.label;
  $('#result-turn').textContent = 'Giliran ' + String(session.pending.number).padStart(3, '0');
  if (!$('#result-dialog').open) $('#result-dialog').showModal();
  if (celebrate) celebratePrize();
}

$('#result-dialog').addEventListener('close', stopConfetti);
$('#result-dialog').addEventListener('cancel', stopConfetti);
motionPreference.addEventListener('change', event => { if (event.matches) stopConfetti(); });

spinButton.addEventListener('click', async () => {
  if (spinning) return;
  if (session.pending) { presentResult(); return; }
  session = reserveSpin(session);
  spinning = true; renderControls(); renderSettings();
  const index = session.prizes.findIndex(p => p.id === session.pending.prizeId);
  const target = targetRotation(index, session.prizes.length, rotation);
  const reducedMotion = motionPreference.matches;
  const animation = wheel.animate([{ transform:'rotate(' + rotation + 'deg)' }, { transform:'rotate(' + target + 'deg)' }], { duration:reducedMotion ? 120 : 4600,easing:'cubic-bezier(.12,.74,.13,1)',fill:'forwards' });
  let frame, lastSegment = Math.floor(rotation / (360 / session.prizes.length));
  const pointer = $('#pointer-body');
  function tickPointer() {
    const progress = animation.effect.getComputedTiming().progress || 0;
    const segment = Math.floor((rotation + (target - rotation) * progress) / (360 / session.prizes.length));
    if (segment !== lastSegment) {
      pointer.getAnimations().forEach(tick => tick.cancel());
      pointer.animate([{ transform:'rotate(0deg)' }, { transform:'rotate(-7deg)',offset:.3 }, { transform:'rotate(0deg)' }], { duration:110,easing:'ease-out' });
      lastSegment = segment;
    }
    frame = requestAnimationFrame(tickPointer);
  }
  if (!reducedMotion) frame = requestAnimationFrame(tickPointer);
  await animation.finished;
  cancelAnimationFrame(frame);
  pointer.getAnimations().forEach(tick => tick.cancel());
  rotation = target; wheel.style.transform = 'rotate(' + rotation + 'deg)'; animation.cancel();
  spinning = false; drawWheel(); renderControls(); renderSettings(); presentResult(true);
});

$('#next-button').addEventListener('click', () => {
  stopConfetti();
  session = nextVisitor(session); $('#result-dialog').close();
  drawWheel(); renderSettings(); spinButton.focus();
});
$('#prize-form').addEventListener('submit', event => {
  event.preventDefault();
  const values = new FormData(event.currentTarget);
  const updated = createSession(session.prizes.map((prize, i) => ({ id:prize.id,label:String(values.get('name-' + i)).trim() || prize.label,quantity:Number(values.get('stock-' + i)) })));
  session = { ...updated,history:session.history };
  $('#settings-message').textContent = 'Hadiah diperbarui untuk sesi ini.';
  drawWheel(); renderSettings();
});
$('#prize-form').addEventListener('invalid', () => { $('#settings-message').textContent = 'Isi nama hadiah dan stok berupa angka 0–9999.'; }, true);
$('#reset-button').addEventListener('click', () => {
  session = createSession(prizes); rotation = 0; wheel.style.transform = 'rotate(0deg)';
  $('#settings-message').textContent = 'Contoh direset.';
  drawWheel(); renderSettings();
});
$('#settings-toggle').addEventListener('click', () => { settingsOpen = !settingsOpen; updatePanel(); showState(); });
$('#close-settings').addEventListener('click', () => { settingsOpen = false; updatePanel(); showState(); $('#settings-toggle').focus(); });
$('#previous-variant').addEventListener('click', () => cycleVariant(-1));
$('#next-variant').addEventListener('click', () => cycleVariant(1));
$('#show-state').addEventListener('click', () => { showState(); $('#state-dialog').showModal(); });
document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => {
  if (button.dataset.close === 'result-dialog') stopConfetti();
  document.getElementById(button.dataset.close).close();
}));
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && settingsOpen && !document.querySelector('dialog[open]')) {
    settingsOpen = false; updatePanel(); showState(); $('#settings-toggle').focus(); return;
  }
  if (!prototypeMode || event.target.closest('input,textarea,select,[contenteditable]') || document.querySelector('dialog[open]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); cycleVariant(event.key === 'ArrowLeft' ? -1 : 1); }
});
document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('keydown', event => {
  if (event.key !== 'Tab') return;
  const controls = [...dialog.querySelectorAll('button:not(:disabled)')];
  if (event.shiftKey && document.activeElement === controls[0]) { event.preventDefault(); controls.at(-1).focus(); }
  else if (!event.shiftKey && document.activeElement === controls.at(-1)) { event.preventDefault(); controls[0].focus(); }
}));
mobile.addEventListener('change', updatePanel);
let width = 0;
new ResizeObserver(() => { if (width !== wheel.clientWidth) { width = wheel.clientWidth; drawWheel(); } }).observe(wheel);
switchVariant(variant); renderSettings(); drawWheel();

</script>
  </body>
</html>
