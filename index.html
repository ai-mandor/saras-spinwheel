<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FFF8F1">
  <title>SARAS · Spinwheel stiker</title>
  <meta name="description" content="Putar roda dan dapatkan stiker di showcase SARAS.">
  <link rel="icon" href="./assets/saras-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="preload" as="image" href="./assets/stickers/saras.png">
  <link rel="preload" as="image" href="./assets/stickers/claude.png">
  <link rel="preload" as="image" href="./assets/stickers/bug-fitur.png">
  <link rel="preload" as="image" href="./assets/stickers/codex.png">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="./index.html" aria-label="SARAS spinwheel">
      <img src="./assets/saras-logo.svg" alt="" width="48" height="32" fetchpriority="high"><span>saras.</span>
    </a>
    <nav aria-label="Menu spinwheel"><button id="settings-toggle" class="secondary-button" type="button" aria-controls="settings-panel" aria-expanded="false">Pengaturan</button></nav>
  </header>
  <h1 class="sr-only">SARAS spinwheel</h1>
  <main id="layout" class="layout">
    <section id="game" class="game" aria-label="Spinwheel hadiah">
      <div class="wheel-stage">
        <div class="pointer" aria-hidden="true">
          <svg id="pointer-body" viewBox="0 0 64 100" width="48" height="75"><path class="pointer-leaf" d="M32 94C27 77 8 55 8 32C8 17 18 6 32 6S56 17 56 32C56 55 37 77 32 94Z"/><circle class="pointer-pin" cx="32" cy="29" r="8"/><path class="pointer-slot" d="M27 29H37"/></svg>
        </div>
        <div class="wheel-frame">
          <svg id="wheel" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="Roda hadiah"></svg>
          <div id="wheel-hub" class="wheel-hub"><div id="hub-brand" class="hub-brand"><img src="./assets/saras-logo.svg" width="62" height="42" alt=""><span>saras.</span></div></div>
        </div>
      </div>
      <div id="game-actions" class="game-actions"><button id="spin-button" class="primary-button" type="button" disabled>Menyiapkan roda…</button></div>
      <p id="spin-status" class="sr-only" role="status" aria-live="polite"></p>
      <p id="error-message" class="error-message" role="alert" hidden></p>
    </section>
    <aside id="settings-panel" class="settings-panel" hidden aria-labelledby="settings-heading">
      <div class="panel-heading"><h2 id="settings-heading">Stiker di roda</h2><button id="close-settings" class="icon-button" type="button" aria-label="Tutup pengaturan"><span aria-hidden="true">×</span></button></div>
      <p class="sample-note">Stok awal contoh. Sesuaikan sebelum acara.</p>
      <p class="storage-note">Stok dan riwayat tersimpan di browser ini.</p>
      <form id="prize-form"><div id="prize-fields" class="prize-fields"></div><button id="apply-button" class="secondary-button apply-button" type="submit">Terapkan hadiah</button></form>
      <div class="session-summary"><span>Putaran selesai</span><strong id="draw-count">0</strong></div>
      <ol id="history" class="history"></ol>
      <div class="panel-actions">
        <button id="export-button" class="text-button" type="button" disabled>Unduh CSV</button>
        <button id="reset-button" class="text-button" type="button">Reset contoh</button>
      </div>
      <p id="settings-message" class="settings-message" role="status"></p>
    </aside>
  </main>
  <dialog id="result-dialog" aria-labelledby="result-heading">
    <canvas id="confetti" width="1" height="1" aria-hidden="true" hidden></canvas>
    <button class="dialog-close icon-button" data-close="result-dialog" type="button" aria-label="Tutup hasil"><span aria-hidden="true">×</span></button>
    <h2 id="result-heading" class="result-caption">Stikermu</h2>
    <img id="result-image" width="320" height="200" alt="" hidden>
    <button id="next-button" class="primary-button" type="button">Hadiah sudah diterima</button>
  </dialog>
  <dialog id="reset-dialog" aria-labelledby="reset-heading">
    <h2 id="reset-heading">Reset contoh?</h2>
    <p>Riwayat di browser ini akan dihapus dan stok kembali ke 20 per stiker.</p>
    <div class="dialog-actions">
      <button class="secondary-button" type="button" data-close="reset-dialog" autofocus>Batal</button>
      <button id="confirm-reset-button" class="primary-button" type="button">Ya, reset</button>
    </div>
  </dialog>
  <footer class="sr-only">SARAS spinwheel</footer>
  <noscript><p class="error-message">Aktifkan JavaScript untuk menggunakan roda stiker.</p></noscript>
</body>
</html>
